# yaml-language-server: $schema=https://raw.githubusercontent.com/ShadowBlip/InputPlumber/main/rootfs/usr/share/inputplumber/schema/capability_map_v1.json
# Schema version number
version: 1

# The type of configuration schema
kind: CapabilityMap

# Name for the device event map
name: ROG Flow Z13 (2025)

# Unique identifier of the capability mapping
id: flw1

# List of mapped events that are activated by a specific set of activation keys.
mapping:
  - name: Armoury Crate button
    source_events:
      - keyboard: KeyProg3
    target_events:
      - keyboard: KeyLeftCtrl
      - keyboard: KeyLeftShift
      - keyboard: KeyTab
  # Holding the Armoury Crate button for ~3 seconds sends the Copilot key
  # chord through the AT keyboard. The hold threshold is set by the firmware,
  # which only reports the button after it decides between a tap and a hold,
  # so it cannot be shortened here.
  - name: Armoury Crate button (hold)
    source_events:
      - keyboard: KeyLeftMeta
      - keyboard: KeyLeftShift
      - keyboard: KeyF23
    target_events:
      - keyboard: KeyLeftShift
      - keyboard: KeyTab

# List of events to filter from the source devices
filtered_events: []