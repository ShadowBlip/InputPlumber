# yaml-language-server: $schema=https://raw.githubusercontent.com/ShadowBlip/InputPlumber/main/rootfs/usr/share/inputplumber/schema/capability_map_v2.json
version: 1

kind: CapabilityMap

name: "Acer Atlas 8"

id: acer_atlas8

# List of mapped events that are activated by a specific set of activation keys.
mapping:
  # This is the hold action, however the hold action only sends a tap
  # Tapping the button currently freezes all controller input
  - name: Guide (hold)
    source_events:
      - keyboard: KeyLeftMeta
    target_event:
      gamepad:
        button: Guide
  # QAM is mapped to the hold action on the button
  - name: QAM (hold)
    source_events:
      - keyboard: KeyF22
    target_event:
      gamepad:
        button: QuickAccess

# List of events to filter from the source devices
filtered_events: []
