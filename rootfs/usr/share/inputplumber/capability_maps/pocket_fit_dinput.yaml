# yaml-language-server: $schema=https://raw.githubusercontent.com/ShadowBlip/InputPlumber/main/rootfs/usr/share/inputplumber/schema/capability_map_v2.json
version: 2
kind: CapabilityMap
name: KONKR Pocket FIT Main Gamepad
id: pocket_fit_dinput

mapping:
    - name: Left Lower Back Button
      source_events:
          - evdev:
                event_type: KEY
                event_code: BTN_Z
                value_type: button
      target_event:
          gamepad:
              button: LeftPaddle2

    - name: Right Lower Back Button
      source_events:
          - evdev:
                event_type: KEY
                event_code: BTN_C
                value_type: button
      target_event:
          gamepad:
              button: RightPaddle2
