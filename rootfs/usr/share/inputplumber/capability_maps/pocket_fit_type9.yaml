# yaml-language-server: $schema=https://raw.githubusercontent.com/ShadowBlip/InputPlumber/main/rootfs/usr/share/inputplumber/schema/capability_map_v2.json
version: 2
kind: CapabilityMap
name: KONKR Pocket FIT Auxiliary Buttons
id: pocket_fit_type9

mapping:
    - name: Right-side Menu Button
      source_events:
          - evdev:
                event_type: KEY
                event_code: BTN7
                value_type: button
      target_event:
          gamepad:
              button: QuickAccess
    - name: Equals Button
      source_events:
          - evdev:
                event_type: KEY
                event_code: BTN6
                value_type: button
      target_event:
          gamepad:
              button: Keyboard
    - name: K Button
      source_events:
          - evdev:
                event_type: KEY
                event_code: BTN5
                value_type: button
      target_event:
          gamepad:
              button: QuickAccess2
    - name: Left Upper Back Button
      source_events:
          - evdev:
                event_type: KEY
                event_code: BTN3
                value_type: button
      target_event:
          gamepad:
              button: LeftPaddle1
    - name: Right Upper Back Button
      source_events:
          - evdev:
                event_type: KEY
                event_code: BTN4
                value_type: button
      target_event:
          gamepad:
              button: RightPaddle1
