# yaml-language-server: $schema=https://raw.githubusercontent.com/ShadowBlip/InputPlumber/main/rootfs/usr/share/inputplumber/schema/capability_map_v1.json
# Schema version number
version: 1

# The type of configuration schema
kind: CapabilityMap

# Name for the device event map
name: OneXPlayer Type 9

# Unique identifier of the capability mapping
id: oxp9

# List of mapped events that are activated by a specific set of activation keys.
mapping:
  - name: Home Short Press
    source_events:
      - keyboard: KeyF13
    target_event:
      gamepad:
        button: Guide
  - name: Home Long Press
    source_events:
      - keyboard: KeyF14
    target_event:
      gamepad:
        button: Guide
  - name: Turbo
    source_events:
      - keyboard: KeyF15
    target_event:
      gamepad:
        button: QuickAccess

  - name: Brightness Up -> R4 (Steam Deck right back paddle)
    source_events:
      - keyboard: KeyBrightnessUp
    target_event:
      gamepad:
        button: RightPaddle1
  - name: Brightness Down -> L4 (Steam Deck left back paddle)
    source_events:
      - keyboard: KeyBrightnessDown
    target_event:
      gamepad:
        button: LeftPaddle1
# List of events to filter from the source devices
filtered_events: []
