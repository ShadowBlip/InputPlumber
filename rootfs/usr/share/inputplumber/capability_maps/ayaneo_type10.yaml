# yaml-language-server: $schema=https://raw.githubusercontent.com/ShadowBlip/InputPlumber/main/rootfs/usr/share/inputplumber/schema/capability_map_v2.json
version: 2
kind: CapabilityMap
name: AYANEO Type 10
id: aya10

mapping:
    - name: South Button
      source_events:
          - evdev:
                event_type: KEY
                event_code: BTN_EAST
                value_type: button
      target_event:
          gamepad:
              button: South
    - name: East Button
      source_events:
          - evdev:
                event_type: KEY
                event_code: BTN_SOUTH
                value_type: button
      target_event:
          gamepad:
              button: East
    - name: West Button
      source_events:
          - evdev:
                event_type: KEY
                event_code: BTN_NORTH
                value_type: button
      target_event:
          gamepad:
              button: West
    - name: North Button
      source_events:
          - evdev:
                event_type: KEY
                event_code: BTN_WEST
                value_type: button
      target_event:
          gamepad:
              button: North
    - name: Left Trigger
      source_events:
          - evdev:
                event_type: ABS
                event_code: ABS_BRAKE
                value_type: trigger
      target_event:
          gamepad:
              trigger:
                  name: LeftTrigger
    - name: Right Trigger
      source_events:
          - evdev:
                event_type: ABS
                event_code: ABS_GAS
                value_type: trigger
      target_event:
          gamepad:
              trigger:
                  name: RightTrigger
    - name: AYANEO Button
      source_events:
          - evdev:
                event_type: KEY
                event_code: KEY_A
                value_type: button
      target_event:
          gamepad:
              button: Guide
    - name: Quick Access Button
      source_events:
          - evdev:
                event_type: KEY
                event_code: KEY_EQUAL
                value_type: button
      target_event:
          gamepad:
              button: QuickAccess
