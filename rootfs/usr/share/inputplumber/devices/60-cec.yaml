# yaml-language-server: $schema=https://raw.githubusercontent.com/ShadowBlip/InputPlumber/main/rootfs/usr/share/inputplumber/schema/composite_device_v1.json
version: 1
kind: CompositeDevice
name: CEC Remote

matches: []

maximum_sources: 1

source_devices:
  - group: keyboard
    udev:
      subsystem: input
      attributes:
        - name: name
          value: "DP-*"
  - group: keyboard
    udev:
      subsystem: input
      attributes:
        - name: name
          value: "HDMI-*"
  # Pulse-Eight USB-CEC Adapter (2548:1002)
  - group: keyboard
    udev:
      subsystem: input
      sys_name: "event*"
      driver: "pulse8-cec"

target_devices:
  - gamepad

capability_map_id: cec_remote

options:
  auto_manage: false
