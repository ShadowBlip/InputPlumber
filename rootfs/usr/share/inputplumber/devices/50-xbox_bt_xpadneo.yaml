# yaml-language-server: $schema=https://raw.githubusercontent.com/ShadowBlip/InputPlumber/main/rootfs/usr/share/inputplumber/schema/composite_device_v1.json
# Schema version number
version: 1

# The type of configuration schema
kind: CompositeDevice

# Loaded before the 60-xbox_* configs: xpadneo can report the Xbox 360 product
# ID (045e:028e, "pretending XB1S Windows wireless mode"), which would otherwise
# match 60-xbox_360_gamepad.yaml and turn every xpadneo input node into its own
# CompositeDevice.

# Name of the composite device mapping. Must match the other Xbox One configs
# so downstream consumers that key on the device name treat it the same
# regardless of which kernel driver bound the controller.
name: Microsoft X-Box One pad

# Only use this profile if *any* of the given matches matches. If this list is
# empty,then the source devices will *always* be checked.
# /sys/class/dmi/id/product_name
matches: []

# Maximum number of source devices per CompositeDevice.
maximum_sources: 1

# One or more source devices to combine into a single virtual device. The events
# from these devices will be watched and translated according to the key map.
# Matches Xbox One/Series controllers over Bluetooth handled by the xpadneo
# kernel driver, which exposes a single unified evdev gamepad (guide button as
# BTN_MODE, rumble via force feedback) for all controller firmware versions.
source_devices:
  - group: gamepad
    udev:
      attributes:
        - name: name
          value: Xbox Wireless Controller
      properties:
        - name: ID_BUS
          value: bluetooth
      driver: xpadneo
      sys_name: "event*"
      subsystem: input

  # xpadneo also creates Consumer Control/Keyboard/Mouse input nodes that share
  # the gamepad's vendor/product ID. Without this rule they fall through to the
  # ID-based 60-xbox_one_gamepad.yaml config and each spawns a ghost
  # CompositeDevice.
  - group: gamepad
    ignore: true
    udev:
      attributes:
        - name: name
          value: "Xbox Wireless Controller *"
      driver: xpadneo
      sys_name: "event*"
      subsystem: input

# The target input device(s) to emulate by default
target_devices:
  - xbox-series
  - mouse
  - keyboard
