version: 1
kind: CompositeDevice
name: AYANEO Pocket DS

options:
    auto_manage: true

matches:
    - udev:
          sys_path: /sys/firmware/devicetree/base
          attributes:
              - name: compatible
                value: ayaneo,pocketds

source_devices:
    # Ayaneo mode
    - group: gamepad
      capability_map_id: aya10
      evdev:
          name: AYANEO Controller
          vendor_id: 4001
          product_id: 0428
          handler: event*
    # Rumble
    - group: gamepad
      hidraw:
          vendor_id: 0x4001
          product_id: 0x0428
          interface_num: 0
    # Xinput mode
    - group: gamepad
      capability_map_id: aya11
      evdev:
          vendor_id: 045e
          product_id: 028e
          handler: event*
    # Extra keys
    - group: keyboard
      capability_map_id: aya10
      evdev:
          name: AYANEO DEVICE
          vendor_id: 1c4f
          product_id: 0002
          handler: event*

target_devices:
    - xbox-elite
    - keyboard
    - mouse
