# yaml-language-server: $schema=../schema/device_profile_v1.json
# Schema version number
version: 1

# The type of configuration schema
kind: DeviceProfile

# Name of the device profile
name: Default

# Target input device(s) to emulate. If unset, the target devices from the device profile will be used.
#target_devices:
#  - gamepad
#  - mouse
#  - keyboard

# Profile mappings
mapping:
  - name: LeftTop
    source_event:
      gamepad:
        button: LeftTop
    target_events:
      - gamepad:
          button: LeftPaddle1
  - name: RightTop
    source_event:
      gamepad:
        button: RightTop
    target_events:
      - gamepad:
          button: RightPaddle1
  - name: Keyboard
    source_event:
      gamepad:
        button: Keyboard
    target_events:
      - gamepad:
          button: Guide
      - gamepad:
          button: North
  - name: QuickAccess2
    source_event:
      gamepad:
        button: QuickAccess2
    target_events:
      - gamepad:
          button: Screenshot
  - name: Left Dial Counter-clockwise
    source_event:
      gamepad:
        dial:
          name: LeftStickDial
          direction: counter-clockwise
    target_events:
      - keyboard: KeyVolumeDown
  - name: Left Dial Clockwise
    source_event:
      gamepad:
        dial:
          name: LeftStickDial
          direction: clockwise
    target_events:
      - keyboard: KeyVolumeUp
  - name: Right Dial Counter-clockwise
    source_event:
      gamepad:
        dial:
          name: RightStickDial
          direction: counter-clockwise
    target_events:
      - keyboard: KeyBrightnessDown
  - name: Right Dial Clockwise
    source_event:
      gamepad:
        dial:
          name: RightStickDial
          direction: clockwise
    target_events:
      - keyboard: KeyBrightnessUp

# Optional input layers: named sets of mappings that override the mappings above
# while they are active. A layer is activated by mapping a source event to a
# `layer` target event, e.g. adding
#   target_events:
#     - layer: { name: guide }
# to a mapping whose source_event is the gamepad Guide button. `mode` defaults
# to `hold` (the layer stays active while the input is held) and can be
# `toggle` (one press latches the layer on, the next press releases it). Layers
# stack: the most recently activated layer wins for a given source event.
#layers:
#  - name: guide
#    mapping:
#      - name: Guide+South -> Esc
#        source_event:
#          gamepad:
#            button: South
#        target_events:
#          - keyboard: KeyEsc
